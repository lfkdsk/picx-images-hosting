<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><title>04 一枚ずつ viewer</title>
<link rel="stylesheet" href="tokens.css"><style>
  html,body{height:100%;overflow:hidden;background:#f2efe9}
  .v{height:100vh;display:grid;grid-template-columns:1fr 232px}
  .im{display:flex;align-items:center;justify-content:center;padding:74px 34px 74px 74px}
  .im .fr{max-height:100%;background:#eae6de;overflow:hidden}
  .im img{max-height:calc(100vh - 148px);width:auto;height:auto;object-fit:contain}
  .side{border-left:1px solid var(--hairline);padding:74px 0 44px;
    display:flex;flex-direction:column;justify-content:space-between}
  .side .top{padding:0 26px}
  .num{font-family:var(--gothic);font-size:10px;letter-spacing:.24em;color:var(--sumi-3)}
  .ttl{margin-top:20px;font-size:19px;letter-spacing:.2em}
  .ttl em{font-style:normal;display:block;margin-top:8px;font-family:var(--gothic);
    font-size:9.5px;letter-spacing:.24em;color:var(--sumi-3);text-transform:uppercase}
  .kv{margin-top:30px}
  .kv div{display:flex;justify-content:space-between;padding:7px 0;
    border-bottom:1px solid var(--hairline-2)}
  .kv span{font-family:var(--gothic);font-size:9.5px;letter-spacing:.15em;
    color:var(--sumi-3);font-variant-numeric:tabular-nums}
  .kv span+span{color:var(--sumi-2)}
  .tatecap{position:absolute;left:30px;bottom:74px;writing-mode:vertical-rl;
    font-size:14px;letter-spacing:.4em;color:var(--sumi-2)}
  .side .bot{padding:0 26px;display:flex;justify-content:space-between;align-items:center}
  .side .bot .k{font-family:var(--gothic);font-size:9px;letter-spacing:.2em;color:var(--sumi-3)}
  .film{position:absolute;left:74px;bottom:26px;display:flex;gap:5px}
  .film i{display:block;width:34px;height:23px;overflow:hidden;background:#e2ded5;opacity:.42}
  .film i.on{opacity:1;outline:1px solid var(--sumi)}
  .film img{width:100%;height:100%;object-fit:cover}</style></head><body><div class="v">
  <div class="im"><div class="fr"><img src="photos/DSCF6077.webp"></div></div>
  <div class="side"><div class="top">
    <div class="num">009 / 041</div>
    <div class="ttl">屋久島<em>Yakushima</em></div>
    <div class="kv">
      <div><span>LENS</span><span>AF 27/1.2 XF      </span></div>
      <div><span>FOCAL</span><span>27mm</span></div>
      <div><span>APERTURE</span><span>F1.2</span></div>
      <div><span>SHUTTER</span><span>1/210s</span></div>
      <div><span>ISO</span><span>320</span></div>
      <div><span>BODY</span><span>X-S20</span></div>
      <div><span>DATE</span><span>2024.09.14 14:48</span></div>
    </div>
    <div style="margin-top:26px;display:flex;align-items:center;gap:9px">
      <span class="seal"></span><span class="meta">DSCF6077</span></div>
  </div>
  <div class="bot"><span class="k">← 前</span><span class="k">ESC 閉じる</span><span class="k">次 →</span></div>
  </div></div>
  <div class="tatecap">杉と苔と雨のあいだ</div>
  <div class="film"><i class=""><img src="photos/IMG_6833-JPEG.webp"></i><i class=""><img src="photos/DSCF6179.webp"></i><i class=""><img src="photos/IMG_6838-JPEG.webp"></i><i class=""><img src="photos/DSCF6079.webp"></i><i class="on"><img src="photos/DSCF6077.webp"></i><i class=""><img src="photos/DSCF6107.webp"></i><i class=""><img src="photos/DSCF6184.webp"></i><i class=""><img src="photos/IMG_6820-JPEG.webp"></i><i class=""><img src="photos/DSCF6265-Enhanced-SR.webp"></i><i class=""><img src="photos/DSCF6218-Enhanced-NR.webp"></i><i class=""><img src="photos/DSCF6065.webp"></i><i class=""><img src="photos/DSCF6431.webp"></i></div></body></html>
