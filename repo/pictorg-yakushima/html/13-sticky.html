<!doctype html><html lang="ja"><head><meta charset="utf-8">
<title>13 sticky column</title><link rel="stylesheet" href="tokens-web.css"><style>
  .wrap{display:grid;grid-template-columns:34% 1fr;gap:6%;
    padding:120px 38px 120px;align-items:start}
  .side{position:sticky;top:26vh}
  .side h1{font-family:var(--mincho);font-size:52px;font-weight:400;
    letter-spacing:.12em;line-height:1.1}
  .side .en{margin-top:14px;font-size:9.5px;letter-spacing:.3em;
    text-transform:uppercase;color:var(--ink-3)}
  .side .lead{margin-top:30px;font-family:var(--mincho);font-size:14px;
    line-height:2.1;color:var(--ink-2);max-width:300px}
  .side .kv{margin-top:34px;max-width:280px}
  .side .kv div{display:flex;justify-content:space-between;padding:6px 0;
    border-bottom:1px solid var(--line-2)}
  .side .kv span{font-size:9px;letter-spacing:.16em;color:var(--ink-3);
    font-variant-numeric:tabular-nums}
  .side .kv span+span{color:var(--ink-2)}
  .side .big{margin-top:34px;font-family:var(--mincho);font-size:13px;letter-spacing:.3em;color:var(--ink-3)}
  .flow{display:flex;flex-direction:column;gap:96px}
  .flow figure{background:var(--paper-2)}
  .flow img{width:100%;height:auto}
  .flow figcaption{margin-top:12px;display:flex;justify-content:space-between}
  .flow .w70{width:70%} .flow .w100{width:100%} .flow .w48{width:48%;align-self:flex-end}</style></head>
<body><div class="wrap">

    <p class="lead">島の三分の二が雨だった。<br>杉と苔と雨のあいだを、<br>四日かけて歩いた。</p>
    <div class="kv">

      <div><span>DATES</span><span>2024.09.13 — 09.16</span></div>
      <div><span>LOCATION</span><span>30.36°N 130.53°E</span></div>
    </div>
